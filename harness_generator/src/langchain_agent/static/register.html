<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>注册 - 模糊测试</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1628 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* 背景装饰：金色光晕 */
    body::before {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      top: -100px;
      left: -100px;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.1) 0%, transparent 70%);
      border-radius: 50%;
      bottom: -80px;
      right: -80px;
      pointer-events: none;
    }

    .card {
      background: linear-gradient(135deg, #1a1f3a 0%, #252d47 100%);
      padding: 48px 40px;
      border-radius: 16px;
      width: 380px;
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.5),
        0 0 60px rgba(212, 175, 55, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(212, 175, 55, 0.3);
      position: relative;
      z-index: 1;
    }

    /* 卡片顶部金色装饰线 */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #d4af37, transparent);
      border-radius: 16px 16px 0 0;
    }

    h2 {
      margin-bottom: 8px;
      color: #d4af37;
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 1px;
    }

    .subtitle {
      text-align: center;
      color: #a0a9c9;
      font-size: 13px;
      margin-bottom: 32px;
      letter-spacing: 0.5px;
    }

    .form-group {
      margin-bottom: 18px;
      position: relative;
    }

    label {
      display: block;
      color: #d4af37;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      color: #e8e8e8;
      font-size: 14px;
      transition: all 300ms ease;
    }

    input::placeholder {
      color: rgba(160, 169, 201, 0.5);
    }

    input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.08);
      border-color: #d4af37;
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.3);
    }

    .btn {
      width: 100%;
      padding: 12px 16px;
      background: linear-gradient(135deg, #d4af37 0%, #e8c547 100%);
      color: #0a0e27;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 300ms ease;
      box-shadow: 0 8px 24px rgba(212, 175, 55, 0.3);
      margin-top: 8px;
    }

    .btn:hover {
      background: linear-gradient(135deg, #e8c547 0%, #f0d560 100%);
      box-shadow: 0 12px 32px rgba(212, 175, 55, 0.5);
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .error {
      color: #ff6b6b;
      font-size: 12px;
      margin-top: 12px;
      display: none;
      padding: 10px 12px;
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid rgba(255, 107, 107, 0.3);
      border-radius: 6px;
      text-align: center;
    }

    .back-btn {
      margin-top: 12px;
      background: none;
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: #d4af37;
      cursor: pointer;
      padding: 12px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 300ms ease;
      width: 100%;
    }

    .back-btn:hover {
      background: rgba(212, 175, 55, 0.1);
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>注册</h2>
    <div class="subtitle">创建您的账户</div>

    <div class="form-group">
      <label>用户名</label>
      <input id="reg_username" type="text" placeholder="请输入用户名" />
    </div>
    <div class="form-group">
      <label>密码</label>
      <input id="reg_password" type="password" placeholder="请输入密码" />
    </div>
    <div class="form-group">
      <label>确认密码</label>
      <input id="reg_confirm_password" type="password" placeholder="请确认密码" />
    </div>
    <button id="register_btn" class="btn">立即注册</button>
    <button class="back-btn" onclick="window.location.href='/'">返回登录</button>
    <div id="register_error" class="error"></div>
  </div>

  <script>
    document.getElementById('register_btn').addEventListener('click', async () => {
      const username = document.getElementById('reg_username').value.trim();
      const password = document.getElementById('reg_password').value.trim();
      const confirmPassword = document.getElementById('reg_confirm_password').value.trim();
      const errorEl = document.getElementById('register_error');

      errorEl.style.display = 'none';
      if (!username || !password || !confirmPassword) {
        errorEl.textContent = '所有字段为必填项';
        errorEl.style.display = 'block';
        return;
      }

      if (password !== confirmPassword) {
        errorEl.textContent = '密码不匹配';
        errorEl.style.display = 'block';
        return;
      }

      // 这里可以添加注册请求的逻辑
      // const res = await fetch('/register', { ... });

      alert('注册成功！'); // 测试用
      window.location.href = '/'; // 注册成功后跳转到登录页面
    });
  </script>
</body>
</html>
